<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Intranet Corporativa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Firebase v8 compat -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  
  
  
  <style>
    :root {
      --red: #E3000F;
      --red-dark: #B8000C;
      --red-light: #FF1A27;
      --blue: #003DA5;
      --blue-dark: #002880;
      --blue-light: #1A56C4;
      --white: #FFFFFF;
      --off-white: #F5F5F5;
      --gray-100: #F0F0F0;
      --gray-200: #E0E0E0;
      --gray-400: #9E9E9E;
      --gray-600: #616161;
      --gray-800: #212121;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-md: 0 4px 24px rgba(0,0,0,0.12);
      --shadow-lg: 0 8px 48px rgba(0,0,0,0.18);
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Barlow', sans-serif;
      background: #ECEEF2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(145deg, #E8EAEF 0%, #DDE0E8 50%, #E4E6ED 100%);
      z-index: 0;
    }

    .bg-shapes {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-shapes::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(227,0,15,0.08) 0%, transparent 70%);
      top: -200px;
      right: -100px;
      animation: pulse 6s ease-in-out infinite;
    }

    .bg-shapes::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(227,0,15,0.06) 0%, transparent 70%);
      bottom: -100px;
      left: -100px;
      animation: pulse 8s ease-in-out infinite reverse;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.1) translate(20px, -20px); }
    }

    .stripe {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: var(--red);
      z-index: 1;
    }

    .login-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }

    .login-card {
      background: rgba(255,255,255,0.98);
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
      overflow: hidden;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-header {
      background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
      padding: 36px 40px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .login-header::before {
      content: '';
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      top: -80px;
      right: -60px;
    }

    .login-header::after {
      content: '';
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      bottom: -40px;
      left: 20px;
    }

    .logo-area {
      position: relative;
      z-index: 1;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      background: white;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .logo-icon svg {
      width: 40px;
      height: 40px;
    }

    .login-header h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: white;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .login-header p {
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      margin-top: 4px;
      font-weight: 400;
    }

    .login-body {
      padding: 36px 40px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--gray-600);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      width: 18px;
      height: 18px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      color: var(--gray-800);
      background: var(--off-white);
      transition: all 0.2s;
      outline: none;
    }

    input:focus {
      border-color: var(--blue);
      background: white;
      box-shadow: 0 0 0 4px rgba(0,61,165,0.1);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,61,165,0.4);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .error-msg {
      background: #fff0f0;
      border-left: 4px solid var(--red);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--red-dark);
      font-size: 13px;
      font-weight: 500;
      margin-top: 16px;
      display: none;
    }

    .login-footer {
      text-align: center;
      padding: 0 40px 28px;
      color: var(--gray-400);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="bg-shapes"></div>
  <div class="stripe"></div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-area">
          <div style="margin-bottom:16px">
            <img id="loginLogo" src="" alt="Colgate" style="height:80px;width:auto;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,0.25)"/>
          </div>
          <h1>Intranet Corporativa</h1>
          <p>Acceso al Portal de Reportes y Análisis</p>
        </div>
      </div>

      <div class="login-body">
        <div class="form-group">
          <label>Usuario</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="username" placeholder="Ingresa tu usuario" autocomplete="username"/>
          </div>
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password"/>
          </div>
        </div>

        <button class="btn-login" onclick="doLogin()">Iniciar Sesión</button>
        <div class="error-msg" id="errorMsg">Usuario o contraseña incorrectos.</div>
      </div>

      <div class="login-footer">
        &copy; 2025 Intranet Corporativa &mdash; Todos los derechos reservados
      </div>
    </div>
  </div>

  <script src="js/logo.js"></script>
  <script src="js/data-firebase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('loginLogo').src = COLGATE_LOGO;
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
    const session = getSession();
    if (session) {
      window.location.href = 'pages/dashboard.html';
    }
  </script>
</body>
</html>
