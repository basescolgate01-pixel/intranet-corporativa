<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Permisos — Intranet Corporativa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared.css"/>
  <style>
    /* All colors use CSS variables → auto dark/light mode */

    .perm-table-wrapper {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 280px);
    }

    .perm-table-scroll {
      flex: 1;
      overflow: auto;
      position: relative;
      /* Scrollbar styling */
      scrollbar-width: thin;
      scrollbar-color: var(--border) var(--bg-input);
    }

    .perm-table-scroll::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    .perm-table-scroll::-webkit-scrollbar-track {
      background: var(--bg-input);
    }

    .perm-table-scroll::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 5px;
      border: 2px solid var(--bg-input);
    }

    .perm-table-scroll::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    .perm-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .perm-table thead {
      background: var(--bg-input);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .perm-table th {
      padding: 14px 12px;
      text-align: left;
      font-weight: 700;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      vertical-align: middle;
      min-width: 100px;
    }

    .perm-table th.user-col {
      width: 240px;
      position: sticky;
      left: 0;
      background: var(--bg-input);
      z-index: 11;
      min-width: 240px;
    }

    .perm-table td {
      padding: 12px;
      border-bottom: 1px solid var(--border-light);
      text-align: center;
      min-width: 100px;
    }

    .perm-table tbody tr:hover {
      background: var(--table-hover);
    }

    .perm-table td.user-col {
      text-align: left;
      position: sticky;
      left: 0;
      background: inherit;
      z-index: 9;
      border-right: 1px solid var(--border);
      width: 240px;
      min-width: 240px;
    }

    .perm-table tbody tr:hover td.user-col {
      background: var(--table-hover);
    }

    .user-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .user-info {
      min-width: 0;
      flex: 1;
    }

    .user-name {
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-dept {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Panel header with icon */
    .panel-header-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .panel-icon {
      font-size: 18px;
      line-height: 1;
    }

    .panel-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      max-width: 120px;
      word-wrap: break-word;
    }

    /* Checkbox style */
    .perm-checkbox {
      position: relative;
      width: 18px;
      height: 18px;
      cursor: pointer;
      display: inline-block;
    }

    .perm-checkbox input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .perm-checkbox-box {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border: 2px solid var(--border);
      border-radius: 4px;
      background: var(--bg-card);
      transition: all 0.15s;
    }

    .perm-checkbox input:checked + .perm-checkbox-box {
      background: var(--red);
      border-color: var(--red);
    }

    .perm-checkbox input:checked + .perm-checkbox-box::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 12px;
      font-weight: bold;
      line-height: 1;
    }

    .perm-checkbox input:focus + .perm-checkbox-box {
      box-shadow: 0 0 0 2px rgba(227, 0, 15, 0.2);
    }

    /* Actions */
    .perm-actions {
      padding: 16px 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-input);
    }

    .perm-count {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Info banner */
    .info-banner {
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      border-radius: 10px;
      padding: 13px 18px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--info-color);
    }
    .info-banner svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* Responsive */
    @media (max-width: 768px) {
      .perm-table th.user-col {
        width: 200px;
      }

      .perm-table th {
        padding: 10px 8px;
        font-size: 11px;
      }

      .perm-table td {
        padding: 10px 8px;
      }

      .panel-name {
        max-width: 100px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <h1>Permisos y Accesos</h1>
      <div class="breadcrumb">Administración / Permisos</div>
    </div>
    <div class="topbar-right">
      <button class="theme-toggle" onclick="toggleTheme()" title="Modo Oscuro"></button>
      <button class="topbar-btn" onclick="openSearch(session)" title="Buscar paneles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
      <div style="position:relative">
        <button class="topbar-btn" onclick="openNotifPanel(session)" title="Notificaciones">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
        <span id="bellBadge" style="position:absolute;top:2px;right:2px;min-width:16px;height:16px;background:var(--red);border-radius:10px;font-size:9px;font-weight:700;color:white;display:none;align-items:center;justify-content:center;padding:0 4px;pointer-events:none"></span>
      </div>
      <button class="btn btn-primary" onclick="saveAllPermissions()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:15px;height:15px">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Guardar Permisos
      </button>
    </div>
  </div>

  <div class="page-content">

    <div class="info-banner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="16" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
      <span>Activa o desactiva el acceso de cada usuario a cada panel. Luego presiona <strong>Guardar Permisos</strong>.</span>
    </div>

    <div class="perm-table-wrapper">
      <div class="perm-table-scroll" id="tableScroll">
        <table class="perm-table" id="permTable">
          <thead id="tableHead">
            <tr>
              <th class="user-col">Usuario</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td class="user-col" style="text-align:center;padding:60px;color:var(--text-muted)">
                Cargando usuarios y paneles...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="perm-actions">
        <span class="perm-count" id="permCount">0 cambios</span>
        <button class="btn btn-primary" onclick="saveAllPermissions()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:15px;height:15px">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          Guardar Permisos
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="../js/logo.js"></script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script>
  let session = null;
  let permState = {}; // permState[panelId][userId] = boolean
  let panels = [];
  let users = [];
  let changeCount = 0;
  let refreshInterval = null;

  (async function() {
    session = await requireAuthMenu();
    if (!session) return;
    window._activePage = 'permissions';
    renderSidebar(session, 'permissions');
    updateBellBadge(session.id);
    loadAndRender();

    // Refrescar cada 10 segundos para detectar nuevos paneles
    refreshInterval = setInterval(() => {
      checkForNewPanels();
    }, 10000);
  }

  async function checkForNewPanels() {
    const newPanels = await getPanels();
    if (newPanels.length !== panels.length) {
      // Se detectaron cambios de paneles, recargar
      await loadAndRender();
    }
  }

  async function loadAndRender() {
    panels = await getPanels();
    const allUsers = await getUsers();
    users = allUsers.filter(u => u.role !== 'admin');

    const thead = document.getElementById('tableHead');
    const tbody = document.getElementById('tableBody');

    if (panels.length === 0 || users.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td class="user-col" style="text-align:center;padding:60px;color:var(--text-muted)">
            ${panels.length === 0 ? 'No hay paneles creados. ' : ''}
            ${users.length === 0 ? 'No hay usuarios regulares creados.' : ''}
          </td>
        </tr>`;
      return;
    }

    // Load all permissions
    for (const p of panels) {
      const pid = Number(p.id);
      if (!permState[pid]) {
        const perms = await getPanelPermissions(pid);
        permState[pid] = {};
        users.forEach(u => {
          permState[pid][u.id] = perms.includes(u.id);
        });
      } else {
        // Si ya existe, mantener los cambios locales
        users.forEach(u => {
          if (!permState[pid].hasOwnProperty(u.id)) {
            permState[pid][u.id] = false;
          }
        });
      }
    }

    // Build header row with panels
    const headerRow = `<tr>
      <th class="user-col">Usuario</th>
      ${panels.map(p => `
        <th title="${p.title}" data-panel-id="${p.id}">
          <div class="panel-header-cell">
            <span class="panel-icon">${p.icon || '📊'}</span>
            <span class="panel-name">${p.title}</span>
          </div>
        </th>
      `).join('')}
    </tr>`;
    thead.innerHTML = headerRow;

    // Build user rows
    const userRows = users.map(u => {
      const bg = avatarColor(u.id);
      const initials = u.avatar || (u.name ? u.name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase() : '?');
      const dept = (u.department || '').substring(0, 20);

      return `<tr data-user-id="${u.id}">
        <td class="user-col">
          <div class="user-cell">
            <div class="user-avatar" style="background:${bg}">${initials}</div>
            <div class="user-info">
              <div class="user-name">${u.name}</div>
              <div class="user-dept">${dept} ${u.username ? '· @' + u.username : ''}</div>
            </div>
          </div>
        </td>
        ${panels.map(p => {
          const isChecked = permState[p.id][u.id];
          return `<td data-panel-id="${p.id}">
            <label class="perm-checkbox">
              <input type="checkbox"
                id="perm-${p.id}-${u.id}"
                ${isChecked ? 'checked' : ''}
                onchange="togglePerm(${p.id}, ${u.id}, this.checked)"
              />
              <span class="perm-checkbox-box"></span>
            </label>
          </td>`;
        }).join('')}
      </tr>`;
    }).join('');

    tbody.innerHTML = userRows;
    updateChangeCount();
  }

  function togglePerm(panelId, userId, checked) {
    panelId = Number(panelId);
    userId = Number(userId);

    const oldValue = permState[panelId][userId];
    permState[panelId][userId] = checked;

    if (oldValue !== checked) {
      changeCount += checked ? 1 : -1;
      updateChangeCount();
    }
  }

  function updateChangeCount() {
    const el = document.getElementById('permCount');
    if (changeCount === 0) {
      el.textContent = 'Sin cambios';
    } else {
      el.textContent = `${changeCount} cambio${changeCount !== 1 ? 's' : ''}`;
    }
  }

  async function saveAllPermissions() {
    for (const p of panels) {
      const pid = Number(p.id);
      const selectedIds = Object.entries(permState[pid])
        .filter(([uid, hasAccess]) => hasAccess)
        .map(([uid]) => Number(uid));
      await setPanelPermissions(pid, selectedIds);
    }
    changeCount = 0;
    updateChangeCount();
    showToast('Permisos guardados correctamente.', 'success');
  }

  // Cleanup
  window.addEventListener('beforeunload', () => {
    if (refreshInterval) clearInterval(refreshInterval);
  });
</script>
<script src="../js/mobile-init.js"></script>
</body>
</html>
